<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background -->
  <rect width="500" height="500" fill="#0a0a0a"/>

  <!-- Intensity zone backgrounds -->
  <!-- Zone 1: Moderate (blue) -->
  <rect x="60" y="60" width="120" height="380" fill="#1a3a5c" opacity="0.4"/>
  <!-- Zone 2: Heavy (yellow/amber) -->
  <rect x="180" y="60" width="120" height="380" fill="#3a2a00" opacity="0.5"/>
  <!-- Zone 3: Severe (orange) -->
  <rect x="300" y="60" width="80" height="380" fill="#3a1500" opacity="0.5"/>
  <!-- Zone 4: Extreme (red) -->
  <rect x="380" y="60" width="80" height="380" fill="#3a0000" opacity="0.6"/>

  <!-- Grid lines -->
  <g stroke="#1e1e1e" stroke-width="1">
    <line x1="60" y1="60" x2="460" y2="60"/>
    <line x1="60" y1="140" x2="460" y2="140"/>
    <line x1="60" y1="220" x2="460" y2="220"/>
    <line x1="60" y1="300" x2="460" y2="300"/>
    <line x1="60" y1="380" x2="460" y2="380"/>
    <line x1="60" y1="60" x2="60" y2="440"/>
    <line x1="160" y1="60" x2="160" y2="440"/>
    <line x1="260" y1="60" x2="260" y2="440"/>
    <line x1="360" y1="60" x2="360" y2="440"/>
    <line x1="460" y1="60" x2="460" y2="440"/>
  </g>

  <!-- Zone threshold lines -->
  <line x1="180" y1="60" x2="180" y2="440" stroke="#4488cc" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>
  <line x1="300" y1="60" x2="300" y2="440" stroke="#ddaa00" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>
  <line x1="380" y1="60" x2="380" y2="440" stroke="#ff6600" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>

  <!-- Zone threshold labels -->
  <text x="183" y="80" fill="#4488cc" font-size="10" font-family="monospace">VT1</text>
  <text x="303" y="80" fill="#ddaa00" font-size="10" font-family="monospace">VT2</text>
  <text x="383" y="80" fill="#ff6600" font-size="10" font-family="monospace">RCP</text>

  <!-- Axes -->
  <line x1="60" y1="440" x2="460" y2="440" stroke="#444" stroke-width="2"/>
  <line x1="60" y1="60" x2="60" y2="440" stroke="#444" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="250" y="480" text-anchor="middle" fill="#666" font-size="13" font-family="monospace">Time (min)</text>
  <text x="20" y="260" text-anchor="middle" fill="#666" font-size="13" font-family="monospace" transform="rotate(-90, 20, 260)">VO₂ (mL/min)</text>

  <!-- Y axis ticks -->
  <text x="50" y="385" text-anchor="end" fill="#555" font-size="11" font-family="monospace">1000</text>
  <text x="50" y="305" text-anchor="end" fill="#555" font-size="11" font-family="monospace">2000</text>
  <text x="50" y="225" text-anchor="end" fill="#555" font-size="11" font-family="monospace">3000</text>
  <text x="50" y="145" text-anchor="end" fill="#555" font-size="11" font-family="monospace">4000</text>

  <!-- X axis ticks -->
  <text x="160" y="458" text-anchor="middle" fill="#555" font-size="11" font-family="monospace">5</text>
  <text x="260" y="458" text-anchor="middle" fill="#555" font-size="11" font-family="monospace">10</text>
  <text x="360" y="458" text-anchor="middle" fill="#555" font-size="11" font-family="monospace">15</text>
  <text x="460" y="458" text-anchor="middle" fill="#555" font-size="11" font-family="monospace">20</text>

  <!-- VO2 line (accent green) -->
  <polyline
    points="60,420 80,415 100,408 120,400 140,390 160,378 180,364 200,348 220,330 240,310 260,288 280,265 300,242 320,218 340,194 360,172 380,155 400,142 420,135 440,130 460,128"
    fill="none" stroke="#00dc82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- VCO2 line (blue) -->
  <polyline
    points="60,425 80,422 100,416 120,409 140,400 160,389 180,376 200,361 220,344 240,326 260,305 280,282 300,258 320,233 340,210 360,192 380,180 400,173 420,170 440,168 460,167"
    fill="none" stroke="#4488ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,3"/>

  <!-- VE line (orange) -->
  <polyline
    points="60,430 80,428 100,424 120,419 140,412 160,402 180,390 200,375 220,356 240,332 260,302 280,268 300,232 320,196 340,166 360,142 380,122 400,108 420,98 440,92 460,88"
    fill="none" stroke="#ff9944" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,3"/>

  <!-- Zone labels inside zones -->
  <text x="120" y="430" text-anchor="middle" fill="#4488cc" font-size="10" font-family="monospace" opacity="0.9">Moderate</text>
  <text x="240" y="430" text-anchor="middle" fill="#ddaa00" font-size="10" font-family="monospace" opacity="0.9">Heavy</text>
  <text x="340" y="430" text-anchor="middle" fill="#ff6600" font-size="10" font-family="monospace" opacity="0.9">Severe</text>
  <text x="420" y="430" text-anchor="middle" fill="#ff3333" font-size="10" font-family="monospace" opacity="0.9">Extreme</text>

  <!-- Legend -->
  <rect x="280" y="95" width="170" height="75" fill="#141414" rx="6"/>
  <line x1="295" y1="115" x2="320" y2="115" stroke="#00dc82" stroke-width="2.5"/>
  <text x="328" y="119" fill="#888" font-size="11" font-family="monospace">VO₂</text>
  <line x1="295" y1="133" x2="320" y2="133" stroke="#4488ff" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="328" y="137" fill="#888" font-size="11" font-family="monospace">VCO₂</text>
  <line x1="295" y1="151" x2="320" y2="151" stroke="#ff9944" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="328" y="155" fill="#888" font-size="11" font-family="monospace">VE</text>

  <!-- Title -->
  <text x="250" y="35" text-anchor="middle" fill="#00dc82" font-size="14" font-family="monospace" font-weight="bold">Oxynet Analysis</text>
</svg>
